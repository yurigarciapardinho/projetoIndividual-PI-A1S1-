<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Zumbi dos Palmeiras</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/acesso.css">
</head>
<body>

    <header class="cabecalhoPrincipal">
        <div class="logoSite" onclick="window.location='index.html'" style="cursor:pointer">ZUMBI DOS PALMEIRAS</div>
        <nav class="navegacaoPrincipal">
            <a href="index.html" class="linkNavegacao">Início</a>
        </nav>
    </header>

    <main class="conteudoAcesso">
        <div id="telaLogin" class="cartaoAcesso">
            <h2 class="tituloFormulario">Entrar na Comunidade</h2>
            <div class="campo">
                <label class="rotuloCampo">E-mail:</label>
                <input type="text" id="inputEmailLogin" class="inputYgp">
            </div>
            <div class="campo">
                <label class="rotuloCampo">Senha:</label>
                <input type="password" id="inputSenhaLogin" class="inputYgp">
            </div>
            <button class="botaoAcesso" onclick="logar()">ENTRAR</button>
            <p class="textoTroca">Não tem conta? <span onclick="alternarTelas()" class="linkTroca">Cadastre-se</span></p>
        </div>

        <div id="telaCadastro" class="cartaoAcesso" style="display: none">
            <h2 class="tituloFormulario">Cadastro</h2>
            <div class="campo">
                <label class="rotuloCampo">Nome Completo:</label>
                <input type="text" id="inputNome" class="inputYgp">
            </div>
            <div class="campo">
                <label class="rotuloCampo">E-mail:</label>
                <input type="text" id="inputEmail" class="inputYgp">
            </div>
            
            <div class="campo">
                <label class="rotuloCampo">Data de Nascimento:</label>
                <input type="text" id="inputDataNascimento" class="inputYgp" placeholder="DD/MM/AAAA" maxlength="10" oninput="mascaraData(this)">
            </div>

            <div class="campo">
                <label class="rotuloCampo">Etnia:</label>
                <select id="selectEtnia" class="inputYgp">
                    <option value="">Selecione</option>
                </select>
            </div>
            
            <div class="campo">
                <label class="rotuloCampo">Sua Região/Zona:</label>
                <select id="selectZona" class="inputYgp" onchange="carregarBairros()">
                    <option value="">Selecione a região</option>
                </select>
            </div>
            
            <div class="campo">
                <label class="rotuloCampo">Seu bairro:</label>
                <select id="selectBairro" class="inputYgp" disabled>
                    <option value="">Selecione a zona primeiro</option>
                </select>
            </div>

            <div class="campo">
                <label class="rotuloCampo">Link da Foto (Opcional):</label>
                <input type="text" id="inputFoto" class="inputYgp" placeholder="Cole a URL da sua foto">
            </div>

            <div class="campo">
                <label class="rotuloCampo">Código de Indicação (Opcional):</label>
                <input type="number" id="inputIndicador" class="inputYgp" placeholder="ID de quem te convidou">
            </div>
            <div class="campo">
                <label class="rotuloCampo">Senha:</label>
                <input type="password" id="inputSenha" class="inputYgp">
            </div>
            <div class="campo">
                <label class="rotuloCampo">Confirmar Senha:</label>
                <input type="password" id="inputConfirmacao" class="inputYgp">
            </div>
            <button class="botaoAcesso" onclick="cadastrar()">CADASTRAR</button>
            <p class="textoTroca">Já é do movimento? <span onclick="alternarTelas()" class="linkTroca">Faça Login</span></p>
        </div>
    </main>

    <footer class="rodapePrincipal">
        <p>Zumbi dos Palmeiras © 2026 - Identidade e Pertencimento</p>
    </footer>

    <script src="js/acesso.js"></script>
    <script>
        window.onload = function() {
            carregarDominios(); // Nova função da V2
            
            if (sessionStorage.ID_USUARIO != undefined) {
                if (sessionStorage.EMAIL_USUARIO === "yuri@zumbipalmeiras.com") {
                    window.location = "dashboard/dashboard-admin.html";
                } else {
                    window.location = "quizz/pesquisa.html";
                }
            }
        }
    </script>
</body>
</html>
